<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>InvestIQ</title>
    <meta name="description" content="Altın, döviz, hisse ve kripto yatırımlarını takip et; kâr/zarar durumunu anlık gör.">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InvestIQ">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <link rel="stylesheet" href="style.css?v=4.0.0">
</head>
<body>
    <div id="app">
        <header class="topbar">
            <div class="brand">
                <img src="icon-192.png" alt="" width="34" height="34">
                <div>
                    <h1>InvestIQ</h1>
                    <p id="status" class="status">Yükleniyor…</p>
                </div>
            </div>
            <div class="top-actions">
                <button id="btnPrivacy" class="icon-btn" aria-label="Tutarları gizle / göster"></button>
                <button id="btnRefresh" class="icon-btn" aria-label="Fiyatları yenile"></button>
            </div>
        </header>

        <main id="main">
            <section class="view" id="view-portfolio"></section>
            <section class="view" id="view-history" hidden></section>
            <section class="view" id="view-analysis" hidden></section>
            <section class="view" id="view-settings" hidden></section>
        </main>

        <button id="fab" class="fab" aria-label="İşlem ekle"></button>

        <nav class="tabbar" id="tabbar">
            <button data-view="portfolio" class="active"><span data-icon="wallet"></span>Portföy</button>
            <button data-view="history"><span data-icon="list"></span>İşlemler</button>
            <button data-view="analysis"><span data-icon="pie"></span>Analiz</button>
            <button data-view="settings"><span data-icon="sliders"></span>Ayarlar</button>
        </nav>
    </div>

    <div id="sheets"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input type="file" id="importFile" accept="application/json,.json,text/plain" hidden>

    <script src="app.js?v=4.0.0"></script>
</body>
</html>

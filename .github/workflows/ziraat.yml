# Ziraat Bankası döviz/altın fiyatlarını çekip "ziraat-data" dalına yazar (Vercel API'sine
# ulaşılamazsa uygulamanın kullandığı yedek). GitHub sık zamanlanmış görevleri geciktirdiği için
# pratikte birkaç saatte bir çalışır.
# Uygulama dosyayı raw.githubusercontent.com üzerinden okur. Dal her seferinde tek
# commit olarak üzerine yazılır, böylece main'in geçmişi kirlenmez.
name: Ziraat fiyatları

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ziraat
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fiyatları çek
        run: node scripts/ziraat.mjs out/ziraat.json

      - name: ziraat-data dalına yaz
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b ziraat-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ziraat.json
          git commit -q -m "Ziraat fiyatları $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ziraat-data
